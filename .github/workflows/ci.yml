name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r app/requirements.txt
      - run: python -m unittest -v test_backend test_setup
      - run: node --check app/static/app.js
      - run: node --check app/static/watchtime.js
      - run: node --test test_playback*.js
      - run: python -m compileall -q app scripts
      - run: docker build --tag playnow:ci .
